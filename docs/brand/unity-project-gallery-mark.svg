<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title">
  <title id="title">Unity Project Gallery mark</title>
  <defs>
    <linearGradient id="markCardFront" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#8CA4FF" />
      <stop offset="0.5" stop-color="#6C8BFF" />
      <stop offset="1" stop-color="#A46BFF" />
    </linearGradient>
    <linearGradient id="markCardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26324A" />
      <stop offset="1" stop-color="#161E2C" />
    </linearGradient>
    <linearGradient id="markSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="markShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04060B" flood-opacity="0.5" />
    </filter>
  </defs>

  <g transform="rotate(-13 200 200)">
    <rect x="72" y="86" width="176" height="232" rx="26" fill="url(#markCardBack)" stroke="#33415C" stroke-width="2" />
  </g>

  <g transform="rotate(11 200 200)">
    <rect x="152" y="76" width="176" height="232" rx="26" fill="#1B2434" stroke="#3A4864" stroke-width="2" />
  </g>

  <g filter="url(#markShadow)">
    <rect x="94" y="82" width="212" height="236" rx="30" fill="url(#markCardFront)" />
    <rect x="94" y="82" width="212" height="236" rx="30" fill="url(#markSheen)" />
    <rect x="95.5" y="83.5" width="209" height="233" rx="28.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3" />
  </g>

  <g stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="200,134 266,172 200,210 134,172" fill="#FFFFFF" fill-opacity="0.98" />
    <polygon points="134,172 200,210 200,276 134,238" fill="#FFFFFF" fill-opacity="0.58" />
    <polygon points="266,172 266,238 200,276 200,210" fill="#FFFFFF" fill-opacity="0.80" />
  </g>
</svg>
