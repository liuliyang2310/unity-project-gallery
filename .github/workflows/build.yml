name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UnityProjectGallery.sln

      - name: Build
        run: dotnet build UnityProjectGallery.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/UnityProjectGallery.Tests/UnityProjectGallery.Tests.csproj -c Release --no-build --verbosity normal
